; PHP-FPM pool overrides for AYULTA (loaded after the default www.conf).
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

; Keep Render environment variables (APP_KEY, APP_URL, …) visible to PHP.
clear_env = no

; Send worker output to the container log.
catch_workers_output = yes
decorate_workers_output = no

; Small footprint for Render's free instance (512 MB RAM).
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
