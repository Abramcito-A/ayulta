# Render Blueprint for AYULTA (Web Service, Docker runtime, free plan).
# Secrets are NOT stored here: values marked "sync: false" are entered in
# the Render dashboard when the Blueprint is applied.
services:
  - type: web
    name: ayulta
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeploy: false
    envVars:
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_NAME
        value: AYULTA
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: es
      - key: APP_FALLBACK_LOCALE
        value: es
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: SESSION_DRIVER
        value: cookie
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_LIFETIME
        value: "120"
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: DEMO_USERS_DRIVER
        value: cookie
